name = "cyjimm-contact-form"
main = "contact-form.mjs"
compatibility_date = "2026-10-06"
workers_dev = false

[observability]
enabled = true

[observability.logs]
enabled = true

[[routes]]
pattern = "cyjimm.com/api/contact*"
zone_name = "cyjimm.com"

[[routes]]
pattern = "www.cyjimm.com/api/contact*"
zone_name = "cyjimm.com"

[build]
# Keep production deployment coupled to the forwarding + acknowledgement tests.
command = "node --test"
